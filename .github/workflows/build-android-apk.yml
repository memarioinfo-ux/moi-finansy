name: Build Moi Finansy v18 Stable Release

on:
  push:
    branches:
      - stable-v18
    paths:
      - "java-sources.tar.gz.b64"
      - ".github/workflows/build-android-apk.yml"
      - "index.html"
      - "icon-512.png"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Download sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "SDK home: ${ANDROID_HOME:-unset}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found under ${ANDROID_HOME}/cmdline-tools"
            exit 1
          fi
          echo "sdkmanager path: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore native notification listener and build project
        shell: bash
        run: |
          set -euo pipefail
          test -s java-sources.tar.gz.b64
          base64 -d java-sources.tar.gz.b64 | tar -xz
          mkdir -p app/src/main/assets app/src/main/res/drawable-nodpi app/src/main/res/values
          cp index.html app/src/main/assets/app.html
          cp icon-512.png app/src/main/res/drawable-nodpi/ic_launcher.png
          cat > settings.gradle <<'GRADLE'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = 'MoiFinansy'
          include ':app'
          GRADLE
          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          GRADLE
          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.alina.budget'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.alina.finances.personal'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0.0'
              }
              buildTypes {
                  release { minifyEnabled false }
              }
          }
          GRADLE
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:allowBackup="false" android:label="@string/app_name"
                android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher"
                android:supportsRtl="true" android:theme="@android:style/Theme.Material.Light.NoActionBar"
                android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.SEND"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <data android:mimeType="text/plain"/>
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.SEND_MULTIPLE"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <data android:mimeType="text/plain"/>
                </intent-filter>
              </activity>
              <service android:name=".MbankNotificationListener"
                  android:exported="true" android:label="@string/listener_name"
                  android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                <intent-filter>
                  <action android:name="android.service.notification.NotificationListenerService"/>
                </intent-filter>
              </service>
            </application>
          </manifest>
          XML
          cat > app/src/main/res/values/strings.xml <<'XML'
          <resources>
              <string name="app_name">Мои финансы</string>
              <string name="listener_name">Мои финансы — банковские уведомления</string>
          </resources>
          XML

      - name: Add navigation and merchant-category rules
        shell: bash
        run: |
          set -euo pipefail
          cp v18_category.js app/src/main/assets/v18_category.js
          cp v18_navigation.js app/src/main/assets/v18_navigation.js
          python3 build_patch_v18.py

      - name: Compile real Android APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Align release APK and package signing tool
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk release-unsigned-aligned.apk
          cp "$BUILD_TOOLS/lib/apksigner.jar" apksigner.jar
          test -s release-unsigned-aligned.apk
          test -s apksigner.jar

      - name: Upload unsigned APK for private signing
        uses: actions/upload-artifact@v4
        with:
          name: Moi-Finansy-v18-Unsigned-Release
          path: |
            release-unsigned-aligned.apk
            apksigner.jar
          if-no-files-found: error
          retention-days: 30
