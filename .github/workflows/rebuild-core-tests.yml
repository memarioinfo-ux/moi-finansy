name: Rebuild v2 core tests

on:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test rebuild/test/ledger.test.mjs
