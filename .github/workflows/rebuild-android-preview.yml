name: Android rebuild v2 preview

on:
  push:
    branches: [rebuild-v2]
    paths:
      - 'rebuild/android/**'
      - '.github/workflows/rebuild-android-preview.yml'
  workflow_dispatch:

concurrency:
  group: rebuild-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        run: test -d "$ANDROID_HOME/cmdline-tools"

      - name: Install platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify local assets
        run: |
          test -s rebuild/android/app/src/main/assets/index.html
          test -s rebuild/android/app/src/main/assets/app.js
          test -s rebuild/android/app/src/main/assets/money.js
          test -s rebuild/android/app/src/main/assets/styles.css

      - name: Validate bundled JavaScript
        run: |
          node --check rebuild/android/app/src/main/assets/app.js
          node --check rebuild/android/app/src/main/assets/money.js

      - name: Assemble isolated debug APK
        working-directory: rebuild/android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: moi-finansy-rebuild-preview
          path: rebuild/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
