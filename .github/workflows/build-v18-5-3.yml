name: Build Moi Finansy 18.5.3 Background Reminders
on:
  push:
    branches: [stable-v18]
    paths:
      - "v18_5_3/**"
      - ".github/workflows/build-v18-5-3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-unsigned:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK platform and tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore Android project from encoded source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d source-v18-5-2.tar.gz.b64 | tar -xz
          test -s app/src/main/assets/category_reminders_v18_5_2.js
          grep -q "versionCode 8" app/build.gradle
      - name: Upgrade to native background category reminders
        shell: bash
        run: |
          set -euo pipefail
          cp v18_5_3/BackgroundBankReminders.java app/src/main/java/com/alina/budget/
          cp v18_5_3/background_reminders.js app/src/main/assets/background_reminders_v18_5_3.js
          python3 v18_5_3/patch.py
          node --check app/src/main/assets/background_reminders_v18_5_3.js
          grep -q "versionCode 9" app/build.gradle
          grep -q "BackgroundBankReminders.notifyNewBankMessage" app/src/main/java/com/alina/budget/MbankNotificationListener.java
      - name: Compile release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Align unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk release-unsigned-aligned.apk
          cp "$BUILD_TOOLS/lib/apksigner.jar" apksigner.jar
          test -s release-unsigned-aligned.apk
      - name: Upload unsigned APK for private signing
        uses: actions/upload-artifact@v4
        with:
          name: Moi-Finansy-v18-5-3-Unsigned
          path: |
            release-unsigned-aligned.apk
            apksigner.jar
          if-no-files-found: error
          retention-days: 7
